name: Build Android APK

# Builds an installable APK from the source tree in this repo. The native android/
# project is generated and patched by scripts/prepare-android.sh, the same script
# used for local builds.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare native project
        run: npm run prepare:android

      - name: Build debug APK
        run: node scripts/gradle.mjs assembleDebug --no-daemon --build-cache --parallel --stacktrace

      - name: Collect outputs
        run: bash scripts/bundle.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-debug-apk
          path: dist/nocturne-debug.apk
          if-no-files-found: error

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nocturne-bundle
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

      # Publish a release on pushes to main and on version tags, but not for PR runs.
      # softprops/action-gh-release creates the tag from the target commit without
      # pushing a tag ref, so this does not retrigger the workflow.
      - name: Determine release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Nocturne ${{ steps.tag.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/${{ env.ZIP_NAME }}
            dist/nocturne-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
